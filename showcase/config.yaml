# Configuration Skills Showcase
# Demonstrates: YAML syntax, configuration patterns, environment setup

application:
  name: "Skills Showcase"
  version: "1.0.0"
  environment: "development"

server:
  host: "localhost"
  port: 8080
  ssl:
    enabled: false
    cert_path: "/path/to/cert.pem"
    key_path: "/path/to/key.pem"

  timeouts:
    read: 30s
    write: 30s
    idle: 120s

  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "https://example.com"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed_headers:
      - Content-Type
      - Authorization

database:
  primary:
    driver: "postgresql"
    host: "localhost"
    port: 5432
    name: "showcase_db"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    pool:
      min_size: 5
      max_size: 20
      timeout: 30s

  cache:
    driver: "redis"
    host: "localhost"
    port: 6379
    ttl: 3600
    max_entries: 10000

logging:
  level: "info"
  format: "json"
  outputs:
    - type: "console"
      enabled: true
    - type: "file"
      enabled: true
      path: "/var/log/showcase/app.log"
      max_size: "100MB"
      max_backups: 5
      compress: true

features:
  authentication:
    enabled: true
    providers:
      - type: "oauth2"
        client_id: "${OAUTH_CLIENT_ID}"
        client_secret: "${OAUTH_CLIENT_SECRET}"
      - type: "jwt"
        secret: "${JWT_SECRET}"
        expiration: 86400

  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst: 10

  monitoring:
    enabled: true
    metrics_port: 9090
    health_check_interval: 30s

integrations:
  external_apis:
    - name: "payment_gateway"
      url: "https://api.payment.example.com"
      api_key: "${PAYMENT_API_KEY}"
      timeout: 15s
      retry:
        attempts: 3
        backoff: "exponential"

    - name: "email_service"
      url: "https://api.email.example.com"
      api_key: "${EMAIL_API_KEY}"
      timeout: 10s

security:
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_days: 90

  headers:
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    strict_transport_security: "max-age=31536000; includeSubDomains"

  password_policy:
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special: true
    max_age_days: 90
